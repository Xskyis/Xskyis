name: ⚡ Update GIFOS Terminal Readme

on:
  schedule:
    # Run everyday at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - '.github/workflows/update-terminal.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install FFmpeg and Dependencies
        run: |
          sudo apt update && sudo apt install -y ffmpeg
          python -m pip install --upgrade pip
          pip install git+https://github.com/x0rzavi/github-readme-terminal.git@main
          pip install -r requirements.txt

      - name: 🎨 Run GIFOS Generation Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIFOS_GENERAL_FPS: 15
          GIFOS_GENERAL_COLOR_SCHEME: "yoru"
        run: |
          python main.py

      - name: 🚀 Commit and Push Updated Readme & GIF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(gifos): auto-refresh terminal readme [skip ci]"
          file_pattern: 'README.md output.gif'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
