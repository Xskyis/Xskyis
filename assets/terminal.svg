<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .term-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; fill: #f8f8f2; }
      .term-title { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; fill: #8c96aa; text-anchor: middle; }
      .term-bold { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; }
      .green { fill: #50fa7b; }
      .cyan { fill: #8be9fd; }
      .orange { fill: #ffb86c; }
      .pink { fill: #ff79c6; }
      .purple { fill: #bd93f9; }
      .yellow { fill: #f1fa8c; }
      .white { fill: #f8f8f2; }
      .muted { fill: #6272a4; }
      .cursor-blink { animation: blink 1s step-start infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .cat-bounce { animation: bounce 3.2s ease-in-out infinite; transform-origin: center; }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(2px); }
      }
      .heart-float { animation: pulseHeart 3.2s ease-in-out infinite; }
      @keyframes pulseHeart {
        0%, 40% { opacity: 0; transform: translateY(4px); }
        50%, 75% { opacity: 1; transform: translateY(0); }
        85%, 100% { opacity: 0; transform: translateY(-4px); }
      }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="0.5" y="0.5" width="839" height="519" rx="10" fill="#12151c" stroke="#3b4252" stroke-width="1"/>
  
  <!-- Window Header Bar -->
  <path d="M 0.5 10.5 A 10 10 0 0 1 10.5 0.5 L 829.5 0.5 A 10 10 0 0 1 839.5 10.5 L 839.5 34.5 L 0.5 34.5 Z" fill="#181c26"/>
  <line x1="0.5" y1="34.5" x2="839.5" y2="34.5" stroke="#2e3440" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="420" y="21" class="term-title">nabilfgrza@gifos: ~ (zsh)</text>

  <!-- Prompt Line (Top) -->
  <g transform="translate(22, 60)">
    <text x="0" y="0" class="term-text green">nabilfgrza</text>
    <text x="83" y="0" class="term-text cyan">@gifos</text>
    <text x="136" y="0" class="term-text orange"> ~> </text>
    <text x="170" y="0" class="term-text white">Fetch.sh -u nabilfgrza</text>
    <text x="345" y="0" class="term-text green cursor-blink">▋</text>
  </g>

  <!-- Left Column: Console Pet Box -->
  <rect x="20" y="80" width="216" height="382" rx="8" fill="#141821" stroke="#2e3440" stroke-width="1"/>
  <text x="32" y="104" class="term-text muted">┌─ [ CONSOLE PET ]</text>

  <!-- Cat Mascot Container with bounce animation -->
  <g class="cat-bounce" transform="translate(44, 125)">
    <!-- Base Cat Pixels -->
    <image href="assets/cat_clean.png" width="168" height="147" />
    <!-- Floating Heart Animation -->
    <path class="heart-float" d="M 120 10 L 124 6 L 128 10 L 132 6 L 136 10 L 128 18 Z" fill="#ff5555" />
  </g>

  <!-- Pet Status Block -->
  <text x="32" y="320" class="term-text green">├─ STATUS: ONLINE</text>
  <text x="32" y="340" class="term-text pink">├─ MOOD:   PURRING</text>
  <text x="32" y="360" class="term-text cyan">├─ LVL:    v2.1</text>
  <text x="32" y="380" class="term-text yellow">└─ BYTES:  8-BIT MEOW</text>

  <!-- Right Column: Interactive Console Output -->
  <!-- User Info Block -->
  <g transform="translate(256, 96)">
    <text x="0" y="0" class="term-bold pink">nabilfgrza@GitHub</text>
    <line x1="0" y1="6" x2="160" y2="6" stroke="#6272a4" stroke-width="1"/>

    <text x="0" y="28" class="term-text cyan">OS:</text>
    <text x="72" y="28" class="term-text white">CachyOS, Parrot OS, Windows 11</text>

    <text x="0" y="46" class="term-text cyan">Host:</text>
    <text x="72" y="46" class="term-text white">Politeknik Negeri Malang (Polinema)</text>

    <text x="0" y="64" class="term-text cyan">Kernel:</text>
    <text x="72" y="64" class="term-text white">Freelance Software Developer</text>

    <text x="0" y="82" class="term-text cyan">Uptime:</text>
    <text x="72" y="82" class="term-text white">21 years, 5 months, 4 days</text>

    <text x="0" y="100" class="term-text cyan">IDE:</text>
    <text x="72" y="100" class="term-text white">neovim, VSCode</text>

    <!-- Contact Block -->
    <text x="0" y="128" class="term-bold orange">Contact:</text>

    <text x="0" y="148" class="term-text purple">Email:</text>
    <text x="72" y="148" class="term-text white">nabilfgrza@web.id</text>

    <text x="0" y="166" class="term-text purple">LinkedIn:</text>
    <text x="72" y="166" class="term-text white">nabilfgrza</text>

    <text x="0" y="184" class="term-text purple">GitHub:</text>
    <text x="72" y="184" class="term-text white">Xskyis</text>

    <!-- GitHub Stats Block -->
    <text x="0" y="212" class="term-bold green">GitHub Stats:</text>

    <text x="0" y="232" class="term-text yellow">Rating:</text>
    <text x="130" y="232" class="term-bold green">A+</text>

    <text x="0" y="250" class="term-text yellow">Stars Earned:</text>
    <text x="130" y="250" class="term-text white">142</text>

    <text x="0" y="268" class="term-text yellow">Commits:</text>
    <text x="130" y="268" class="term-text white">748</text>

    <text x="0" y="286" class="term-text yellow">PRs:</text>
    <text x="130" y="286" class="term-text white">36  (Merged: 89.2%)</text>

    <text x="0" y="304" class="term-text yellow">Total Contribs:</text>
    <text x="130" y="304" class="term-text white">912</text>

    <text x="0" y="322" class="term-text yellow">Top Languages:</text>
    <text x="130" y="322" class="term-text white">JS, PHP, Python, HTML, CSS</text>

    <!-- ANSI Palette Blocks -->
    <g transform="translate(0, 334)">
      <rect x="0" y="0" width="28" height="12" fill="#282a36"/>
      <rect x="34" y="0" width="28" height="12" fill="#ff5555"/>
      <rect x="68" y="0" width="28" height="12" fill="#50fa7b"/>
      <rect x="102" y="0" width="28" height="12" fill="#f1fa8c"/>
      <rect x="136" y="0" width="28" height="12" fill="#bd93f9"/>
      <rect x="170" y="0" width="28" height="12" fill="#ff79c6"/>
      <rect x="204" y="0" width="28" height="12" fill="#8be9fd"/>
      <rect x="238" y="0" width="28" height="12" fill="#f8f8f2"/>
    </g>
  </g>

  <!-- Footer Command Prompt Line -->
  <g transform="translate(22, 500)">
    <text x="0" y="0" class="term-text green">nabilfgrza</text>
    <text x="83" y="0" class="term-text cyan">@gifos</text>
    <text x="136" y="0" class="term-text orange"> ~> </text>
    <text x="170" y="0" class="term-text purple"># Have a nice day kin</text>
    <text x="338" y="0" class="term-text white cursor-blink">_</text>
  </g>
</svg>